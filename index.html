<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동아플</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #71C9F8;
      --blue-dark: #4BAEE8;
      --blue-nav: #A8D8F8;
      --blue-inner: #C5EAF8;
      --blue-field: #D2F0FC;
      --white: #fff;
      --text: #222;
      --muted: #8a8a8a;
      --star: #FFB800;
      --star-empty: #c8c8c8;
      --frame-w: 1440px;
      --sidebar-w: 26%;
      --radius: 22px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Noto Sans KR',sans-serif; color:var(--text); min-height:100vh;
      background-color:#fff;
      background-image: radial-gradient(circle, #c8c8c8 1.2px, transparent 1.2px);
      background-size:18px 18px;
      display:flex; align-items:flex-start; justify-content:center;
      padding:18px 14px 24px;
    }

    .app {
      display:flex; width:min(var(--frame-w), 96vw);
      min-height:calc(100vh - 42px);
      background:transparent;
    }

    /* ── 사이드바 (~1/4) ── */
    .sidebar {
      width:var(--sidebar-w); min-width:240px; max-width:340px; flex-shrink:0;
      padding:28px 18px 28px 22px;
      border-right:5px solid var(--blue); display:flex; flex-direction:column;
      background:transparent;
    }
    .brand { margin-bottom:32px; cursor:pointer; user-select:none; }
    .brand-sub { font-size:13px; font-weight:500; color:#444; margin-bottom:4px; }
    .brand-row { display:flex; align-items:center; gap:8px; }
    .apple { width:40px; height:40px; flex-shrink:0; }
    .brand-name { font-size:30px; font-weight:900; letter-spacing:-0.5px; line-height:1.1; }
    .nav { display:flex; flex-direction:column; gap:12px; flex:1; }
    .nav-btn {
      width:fit-content; min-width:70%; text-align:left; padding:10px 20px; border:none; background:transparent;
      font-family:inherit; font-size:16px; font-weight:800; color:var(--text);
      cursor:pointer; border-radius:18px;
    }
    .nav-btn:hover { background:#eef8ff; }
    .nav-btn.active { background:var(--blue-nav); color:var(--text); }
    .nav-sub { font-size:13px; padding:0 18px 8px 22px; color:var(--muted); line-height:1.4; }

    /* ── 메인 ── */
    .main { flex:1; min-width:0; display:flex; flex-direction:column; }
    .screen {
      flex:1; background:transparent;
      padding:20px 36px 36px; position:relative; overflow-y:auto;
    }
    .toolbar {
      display:grid; grid-template-columns:1fr auto 1fr;
      align-items:center; margin-bottom:18px; min-height:40px; gap:12px;
    }
    .toolbar-center {
      display:flex; align-items:center; gap:8px;
      font-size:16px; font-weight:800;
    }
    .toolbar-right { display:flex; align-items:center; gap:10px; justify-self:end; }
    .btn-login {
      background:var(--blue); color:#fff; border:none; border-radius:999px;
      padding:8px 22px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
    }
    .btn-login:hover { background:var(--blue-dark); }
    .user-tag { font-size:14px; font-weight:700; }
    .user-tag button {
      margin-left:8px; border:none; background:var(--blue); color:#fff;
      border-radius:999px; padding:6px 14px; font-size:12px; cursor:pointer; font-family:inherit;
    }

    .page { display:none; }
    .page.active { display:block; }

    .stars { font-size:22px; letter-spacing:2px; color:var(--star); line-height:1; }
    .stars.grey { color:var(--star-empty); }
    .star-pick { display:inline-flex; gap:2px; font-size:24px; cursor:pointer; }
    .star-pick span { color:var(--star-empty); }
    .star-pick span.on { color:var(--star); }

    .btn-pill {
      background:var(--blue); color:#fff; border:none; border-radius:999px;
      padding:8px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
    }
    .btn-pill:hover { background:var(--blue-dark); }
    .btn-pill.white { background:var(--white); color:var(--blue-dark); border:1.5px solid var(--blue); }

    .field {
      background:var(--blue-field); border-radius:16px; padding:14px 18px;
      margin-bottom:12px; border:none;
    }
    .field-label {
      font-size:18px; font-weight:900; color:var(--text); margin-bottom:4px;
    }
    .field-label.sm { font-size:14px; font-weight:800; color:var(--text); }
    .field-sub { font-size:13px; color:var(--muted); margin-bottom:10px; }
    .field p { font-size:15px; line-height:1.6; white-space:pre-wrap; }
    .field textarea, .field input[type=text] {
      width:100%; border:none; background:transparent; font-family:inherit;
      font-size:15px; resize:vertical; min-height:44px; outline:none;
    }
    .field input[type=text] { min-height:auto; }

    .course-hero {
      display:flex; gap:14px; align-items:stretch; margin-bottom:20px;
    }
    .hero-logo {
      width:22%; min-width:120px; max-width:180px; min-height:92px;
      background:var(--blue); border-radius:28px;
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:17px; font-weight:800; text-align:center; flex-shrink:0;
    }
    .hero-title {
      flex:1; background:var(--blue); border-radius:28px; min-height:92px;
      display:flex; align-items:center; justify-content:center;
      padding:16px 28px;
      color:#fff; font-size:28px; font-weight:900;
    }
    .info-lines { font-size:16px; font-weight:700; line-height:2; margin-bottom:26px; }
    .action-block { margin-bottom:20px; }
    .action-block h3 { font-size:18px; font-weight:900; margin-bottom:2px; }
    .action-block .hint { font-size:13px; color:var(--muted); font-weight:500; margin-bottom:8px; }
    .blue-bar {
      width:100%; height:52px; min-height:52px; background:var(--blue); border:none; border-radius:26px;
      padding:12px 20px; font-family:inherit; font-size:15px; color:#fff;
      resize:none; outline:none;
    }
    .blue-bar::placeholder { color:rgba(255,255,255,0.8); }
    .blue-bar-static {
      width:100%; min-height:52px; background:var(--blue); border-radius:26px;
      padding:14px 20px; color:#fff; font-size:15px; line-height:1.55; white-space:pre-wrap;
    }

    .course-banner {
      display:flex; gap:16px; align-items:center; margin-bottom:18px;
    }
    .logo-box {
      width:150px; height:100px; background:var(--blue); border-radius:26px;
      display:flex; align-items:center; justify-content:center; font-size:18px;
      font-weight:800; text-align:center; line-height:1.35; flex-shrink:0; color:#fff;
    }
    .course-banner h2 {
      flex:1; background:var(--blue); border-radius:26px; min-height:100px;
      display:flex; align-items:center; padding:18px 32px;
      color:#fff; font-size:32px; font-weight:900;
    }
    .week-text { font-size:16px; font-weight:700; margin:8px 0 16px; }

    .ext-list { display:flex; flex-direction:column; gap:14px; }
    .ext-card {
      display:flex; align-items:center; gap:16px;
    }
    .ext-card .logo-box { width:100px; height:72px; font-size:14px; }
    .ext-card h3 {
      flex:1; background:var(--blue); border-radius:22px; min-height:72px;
      display:flex; align-items:center; padding:12px 24px;
      color:#fff; font-size:22px; font-weight:800;
    }
    .ext-card .stars { font-size:20px; margin-right:8px; }
    .ext-card-actions { display:flex; gap:8px; flex-shrink:0; }

    .profile {
      background:var(--blue); border-radius:22px; padding:24px 28px; color:#fff; margin-bottom:20px;
    }
    .profile h2 { font-size:24px; font-weight:900; display:inline; }
    .grade-tag {
      display:inline-block; background:rgba(255,255,255,0.28); padding:4px 12px;
      border-radius:999px; font-size:13px; font-weight:700; margin-left:8px; vertical-align:middle;
    }
    .profile-note { font-size:14px; margin-top:14px; opacity:0.95; line-height:1.5; }
    .section-title { font-size:16px; font-weight:900; margin-bottom:12px; }
    .chip-row { display:flex; gap:10px; flex-wrap:wrap; }
    .chip {
      width:88px; height:72px; background:var(--blue); border-radius:16px;
      display:flex; align-items:center; justify-content:center; color:#fff;
      font-size:13px; font-weight:700; text-align:center; cursor:pointer; line-height:1.25;
    }

    .hw-banner {
      background:var(--blue); color:#fff; padding:18px 24px; border-radius:22px;
      font-size:22px; font-weight:800; margin-bottom:20px;
    }
    .hw-body {
      font-size:clamp(28px,4vw,42px); font-weight:900; text-align:center;
      padding:48px 16px; line-height:1.35;
    }
    .hw-foot { text-align:right; margin-top:16px; }

    .student-item {
      display:flex; align-items:center; gap:10px; padding:12px 0;
      border-bottom:1px solid rgba(126,200,245,0.45); font-size:15px;
    }
    .student-item .no { font-weight:900; width:24px; color:var(--blue-dark); }
    .student-item .nm { width:90px; font-weight:700; flex-shrink:0; }
    .student-item .track {
      flex:1; height:28px; background:var(--blue-field); border-radius:8px;
      border:1px solid var(--blue); min-width:0;
    }
    .student-item .btn-pill { flex-shrink:0; }

    .create-top { display:flex; gap:16px; margin-bottom:12px; align-items:flex-start; }
    .create-logo {
      width:120px; height:88px; background:var(--blue); border-radius:22px;
      display:flex; align-items:center; justify-content:center; color:#fff;
      font-size:14px; font-weight:700; text-align:center; line-height:1.35; flex-shrink:0;
    }
    .create-title-in {
      flex:1; background:var(--blue); border:none; color:#fff;
      border-radius:22px; padding:16px 24px; font-family:inherit; font-size:22px; font-weight:800;
      min-height:88px;
    }
    .create-title-in::placeholder { color:rgba(255,255,255,0.75); }
    .create-note { font-size:13px; color:var(--muted); margin-bottom:14px; line-height:1.55; }
    .create-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }
    .create-grid .field { margin:0; min-height:90px; }
    .create-foot { text-align:right; margin-top:8px; }
    .btn-big {
      background:var(--blue); color:#fff; border:none; border-radius:999px;
      padding:12px 28px; font-size:16px; font-weight:800; cursor:pointer; font-family:inherit;
    }

    .q-item {
      background:var(--white); border-radius:10px; padding:14px 16px;
      margin-bottom:10px; border:1px solid rgba(113,201,248,0.55);
    }
    .q-item .tag { font-size:11px; font-weight:800; color:var(--blue-dark); margin-bottom:6px; }
    .q-item .body { font-size:13px; line-height:1.55; margin-bottom:8px; white-space:pre-wrap; }
    .q-item textarea {
      width:100%; min-height:56px; padding:10px; border:1px solid var(--blue);
      border-radius:8px; background:var(--blue-field); font-family:inherit; font-size:12px;
      margin-bottom:8px; resize:vertical;
    }
    .feed-title { font-size:14px; font-weight:900; margin-bottom:12px; }

    .empty { text-align:center; padding:36px 12px; color:var(--muted); font-size:13px; line-height:1.7; }

    /* 모달 */
    .overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35);
      z-index:100; align-items:center; justify-content:center; padding:20px;
    }
    .overlay.show { display:flex; }
    .modal {
      background:#fff; border-radius:18px; width:100%; max-width:400px;
      padding:24px; border:2px solid var(--blue);
    }
    .modal h2 { font-size:18px; font-weight:900; margin-bottom:4px; }
    .modal p { font-size:12px; color:var(--muted); margin-bottom:14px; }
    .modal input {
      width:100%; padding:11px; border:1.5px solid var(--blue); border-radius:10px;
      font-family:inherit; margin-bottom:10px; font-size:13px; background:var(--blue-field);
    }
    .role-row, .tab-row { display:flex; gap:8px; margin-bottom:12px; }
    .role-row button, .tab-row button {
      flex:1; padding:10px; border:1.5px solid var(--blue); border-radius:10px;
      background:#fff; font-weight:700; font-size:12px; cursor:pointer; font-family:inherit;
    }
    .role-row button.active, .tab-row button.active { background:var(--blue-inner); border-color:var(--blue-dark); }
    .modal-btns { display:flex; gap:8px; margin-top:6px; }
    .modal-btns button {
      flex:1; padding:11px; border-radius:10px; font-weight:700; cursor:pointer;
      font-family:inherit; border:none; font-size:13px;
    }
    .modal-btns .c { background:#eee; }
    .modal-btns .ok { background:var(--blue); color:#fff; }
    .err { color:#e74c3c; font-size:11px; min-height:16px; margin-bottom:6px; }

    @media (max-width:800px) {
      .app { flex-direction:column; min-height:auto; }
      .sidebar { width:100%; border-right:none; border-bottom:5px solid var(--blue); flex-direction:row; flex-wrap:wrap; align-items:center; gap:8px; padding:16px; }
      .brand { margin-bottom:0; }
      .nav { flex-direction:row; flex-wrap:wrap; }
      .screen { padding:16px; }
      .toolbar { grid-template-columns:1fr; justify-items:start; }
      .toolbar-right { justify-self:start; }
      .hero-title, .course-banner h2 { font-size:20px; }
      .create-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand" onclick="goDefaultPage()">
        <div class="brand-sub">동아리용 학습 어플,</div>
        <div class="brand-row">
          <div class="brand-name">동아플</div>
          <svg class="apple" viewBox="0 0 32 32"><circle cx="16" cy="18" r="11" fill="#e74c3c"/><ellipse cx="16" cy="8" rx="4" ry="6" fill="#27ae60" transform="rotate(-20 16 8)"/></svg>
        </div>
      </div>
      <nav class="nav" id="nav-student">
        <button class="nav-btn active" data-p="mine" onclick="showPage('mine')">나의 강의</button>
        <button class="nav-btn" data-p="external" onclick="showPage('external')">외부 강의들</button>
        <button class="nav-btn" data-p="mypage" onclick="showPage('mypage')">마이 페이지</button>
        <button class="nav-btn" data-p="homework" onclick="showPage('homework')">숙제</button>
      </nav>
      <nav class="nav" id="nav-teacher" style="display:none">
        <button class="nav-btn" data-p="students" onclick="showPage('students')">학생 관리</button>
        <button class="nav-btn" data-p="create" onclick="showPage('create')">강의 설정</button>
        <span class="nav-sub">· 강의 만들기</span>
        <button class="nav-btn" data-p="mypage" onclick="showPage('mypage')">마이 페이지</button>
        <button class="nav-btn" data-p="questions" onclick="showPage('questions')">질문 / 평가 보기</button>
      </nav>
    </aside>

    <div class="main">
      <div class="screen">
        <div class="toolbar">
          <div id="auth-area"></div>
          <div class="toolbar-center" id="toolbar-center"></div>
          <div class="toolbar-right" id="toolbar-extra"></div>
        </div>

        <div id="page-external" class="page">
          <div class="ext-list" id="external-list"></div>
          <div class="empty" id="external-empty" style="display:none">아직 등록된 강의가 없어요.</div>
        </div>

        <div id="page-mine" class="page active">
          <div id="mine-content"></div>
        </div>

        <div id="page-mypage" class="page">
          <div id="mypage-content"></div>
        </div>

        <div id="page-homework" class="page">
          <div id="homework-content"></div>
        </div>

        <div id="page-students" class="page">
          <div id="students-content"></div>
        </div>

        <div id="page-create" class="page">
          <div class="create-top">
            <div class="create-logo">(강의 로고)<br>업로드</div>
            <input class="create-title-in" id="create-title" placeholder="(제목 입력)">
          </div>
          <p class="create-note">※ 로고는 관리자 승인 후 표시됩니다. 같은 강의를 중복으로 만들지 마세요.</p>
          <div class="create-grid">
            <div class="field"><div class="field-label">몇 주차까지?</div><input type="text" id="create-weeks" placeholder="8"></div>
            <div class="field"><div class="field-label">강의 내용 입력</div><textarea id="create-content" placeholder=""></textarea></div>
            <div class="field"><div class="field-label">준비물 입력</div><textarea id="create-materials" placeholder=""></textarea></div>
          </div>
          <div class="field"><div class="field-label">숙제 내용</div><textarea id="create-homework" placeholder="숙제 내용 입력"></textarea></div>
          <div class="create-foot"><button class="btn-big" onclick="createCourse()">강의 제작</button></div>
        </div>

        <div id="page-questions" class="page">
          <div class="feed-title">온 질문들</div>
          <div id="teacher-questions"></div>
          <div class="empty" id="questions-empty" style="display:none">아직 온 질문이 없어요.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="login-modal">
    <div class="modal">
      <h2 id="modal-title">Log in</h2>
      <p>동아플 · 학생 / 선생님 계정</p>
      <div class="role-row">
        <button type="button" id="pick-student" class="active" onclick="setAuthRole('student')">학생 계정</button>
        <button type="button" id="pick-teacher" onclick="setAuthRole('teacher')">선생님 계정</button>
      </div>
      <div class="tab-row">
        <button class="active" id="tab-login" onclick="authTab('login')">로그인</button>
        <button id="tab-signup" onclick="authTab('signup')">회원가입</button>
      </div>
      <div class="err" id="auth-err"></div>
      <input id="auth-id" placeholder="아이디">
      <input id="auth-pw" type="password" placeholder="비밀번호">
      <input id="auth-pw2" type="password" placeholder="비밀번호 확인" style="display:none">
      <input id="auth-teacher-code" type="password" placeholder="선생님 가입 코드" style="display:none">
      <div class="modal-btns">
        <button class="c" onclick="closeLogin()">취소</button>
        <button class="ok" onclick="submitAuth()">확인</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="review-modal">
    <div class="modal">
      <h2>후기 작성</h2>
      <p id="review-course-name"></p>
      <div class="star-pick" id="review-stars"></div>
      <textarea class="field" id="review-text" placeholder="후기를 적어 주세요" style="margin-top:12px;width:100%;min-height:90px;padding:12px;border:1.5px solid var(--blue);border-radius:10px;background:var(--blue-field);font-family:inherit"></textarea>
      <div class="modal-btns" style="margin-top:12px">
        <button class="c" onclick="closeReview()">취소</button>
        <button class="ok" onclick="submitReview()">등록</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="reviews-view-modal">
    <div class="modal" style="max-height:80vh;overflow-y:auto">
      <h2>후기 보기</h2>
      <p id="reviews-view-title"></p>
      <div id="reviews-list"></div>
      <div class="modal-btns" style="margin-top:12px"><button class="c" onclick="closeReviewsView()">닫기</button></div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwAYvsUMtk-oRtCqZGRdIw4Y4DsJ4lNH9t_M-VMwR7u0pfDj2GXrStsCNU9GeR7BLrH4g/exec';
    const TEACHER_CODE = '2026';
    const DATA_VERSION = 'dap-v4';
    const LS = { user:'dap_user', accounts:'dap_accounts', courses:'dap_courses', enroll:'dap_enroll', questions:'dap_questions', reviews:'dap_reviews', evals:'dap_evals', hwDone:'dap_hw_done' };

    let user = null, authRole = 'student', authMode = 'login';
    let courses = [], enrollments = [], questions = [], reviews = [], evaluations = [];
    let selectedCourseId = null, reviewRating = 5, reviewCourseId = null;

    function wipeOldData() {
      Object.keys(localStorage).forEach(k => { if (k.startsWith('2bs_') || k.startsWith('dap_')) localStorage.removeItem(k); });
    }
    async function serverWipeOnce() { /* 자동 데이터 삭제 비활성화 */ }
    function initData() {
      if (localStorage.getItem('dap_version') !== DATA_VERSION) {
        Object.keys(localStorage).forEach(k => { if (k.startsWith('2bs_')) localStorage.removeItem(k); });
        localStorage.setItem('dap_version', DATA_VERSION);
      }
      try { user = JSON.parse(localStorage.getItem(LS.user) || 'null'); } catch(e) { user = null; }
      courses = readLS(LS.courses, []); enrollments = readLS(LS.enroll, []);
      questions = readLS(LS.questions, []); reviews = readLS(LS.reviews, []); evaluations = readLS(LS.evals, []);
    }
    function readLS(k, fb) { try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(fb)); } catch(e) { return fb; } }
    function writeLS(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
    function sheetReady() { return APPS_SCRIPT_URL.startsWith('http'); }
    async function apiPost(body) {
      if (!sheetReady()) return null;
      try {
        const res = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body) });
        const text = await res.text();
        try { return JSON.parse(text); } catch(e) { return { ok:false, error: res.ok ? 'badjson' : 'http_'+res.status }; }
      } catch(e) { return { ok:false, error:'network' }; }
    }
    async function apiGet(action, extra) {
      if (!sheetReady()) return null;
      try {
        const q = new URLSearchParams(Object.assign({ action }, extra || {}));
        const res = await fetch(APPS_SCRIPT_URL + '?' + q);
        const text = await res.text();
        try { return JSON.parse(text); } catch(e) { return { ok:false, error:'badjson' }; }
      } catch(e) { return { ok:false, error:'network' }; }
    }
    async function authRequest(body) {
      let data = await apiPost(body);
      if (data && data.ok) return data;
      data = await apiGet(body.action, {
        username: body.username, passHash: body.passHash, role: body.role,
        displayName: body.displayName || '', teacherCode: body.teacherCode || ''
      });
      if (data && data.ok) return data;
      const accounts = readLS(LS.accounts, {});
      if (body.action === 'signup') {
        if (accounts[body.username]) return { ok:false, error:'exists' };
        accounts[body.username] = { passHash: body.passHash, role: body.role || 'student' };
        writeLS(LS.accounts, accounts);
        return { ok:true, username:body.username, role:body.role, displayName:body.displayName||body.username, grade: body.role==='teacher'?'선생님':'초급', points:0 };
      }
      const acc = accounts[body.username];
      if (!acc || acc.passHash !== body.passHash) return { ok:false, error:'bad' };
      if (body.role && acc.role !== body.role) return { ok:false, error:'badrole' };
      return { ok:true, username:body.username, role:acc.role, displayName:body.displayName||body.username, grade:acc.role==='teacher'?'선생님':'초급', points:0 };
    }
    async function syncAll() {
      if (!sheetReady()) return;
      const [c,e,q,r,ev] = await Promise.all([
        apiGet('listCourses'), apiGet('listEnrollments'),
        apiGet('listQuestions'), apiGet('listReviews'), apiGet('listEvaluations')
      ]);
      if (c && c.items) { courses = c.items; writeLS(LS.courses, courses); }
      if (e && e.items) { enrollments = e.items; writeLS(LS.enroll, enrollments); }
      if (q && q.items) { questions = q.items; writeLS(LS.questions, questions); }
      if (r && r.items) { reviews = r.items; writeLS(LS.reviews, reviews); }
      if (ev && ev.items) { evaluations = ev.items; writeLS(LS.evals, evaluations); }
    }
    async function hashPass(pw) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('dap:' + pw));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
    }

    function starsHtml(rating) {
      const r = Number(rating) || 0;
      let s = '';
      for (let i = 1; i <= 5; i++) {
        s += `<span style="color:${i <= Math.round(r) ? 'var(--star)' : 'var(--star-empty)'}">★</span>`;
      }
      return `<span class="stars">${s}</span>`;
    }
    function avgRating(id) {
      const rs = reviews.filter(r => r.courseId === id);
      return rs.length ? rs.reduce((a,r) => a + Number(r.rating||0), 0) / rs.length : 0;
    }
    function myReviewFor(courseId) {
      return reviews.find(r => r.uid === user.uid && r.courseId === courseId);
    }
    function isTeacher() { return user && user.role === 'teacher'; }
    function getCourse(id) { return courses.find(c => c.id === id); }
    function myEnrollments() { return user ? enrollments.filter(e => e.uid === user.uid) : []; }

    function setToolbarExtra(html) { document.getElementById('toolbar-extra').innerHTML = html || ''; }
    function setToolbarCenter(html) { document.getElementById('toolbar-center').innerHTML = html || ''; }

    function renderAuth() {
      const el = document.getElementById('auth-area');
      if (user) {
        el.innerHTML = `<span class="user-tag">${esc(user.displayName)}<button onclick="logout()">로그아웃</button></span>`;
      } else {
        el.innerHTML = `<button class="btn-login" onclick="openLogin()">Log in</button>`;
      }
      document.getElementById('nav-student').style.display = isTeacher() ? 'none' : 'flex';
      document.getElementById('nav-teacher').style.display = isTeacher() ? 'flex' : 'none';
    }

    function openLogin() { document.getElementById('login-modal').classList.add('show'); authTab('login'); setAuthRole('student'); document.getElementById('auth-err').textContent=''; }
    function closeLogin() { document.getElementById('login-modal').classList.remove('show'); }
    function setAuthRole(r) {
      authRole = r;
      document.getElementById('pick-student').classList.toggle('active', r==='student');
      document.getElementById('pick-teacher').classList.toggle('active', r==='teacher');
      document.getElementById('auth-teacher-code').style.display = (authMode==='signup' && r==='teacher') ? 'block' : 'none';
    }
    function authTab(t) {
      authMode = t;
      document.getElementById('tab-login').classList.toggle('active', t==='login');
      document.getElementById('tab-signup').classList.toggle('active', t==='signup');
      document.getElementById('auth-pw2').style.display = t==='signup' ? 'block' : 'none';
      document.getElementById('auth-teacher-code').style.display = (t==='signup' && authRole==='teacher') ? 'block' : 'none';
    }
    async function submitAuth() {
      const id = document.getElementById('auth-id').value.trim();
      const pw = document.getElementById('auth-pw').value;
      const pw2 = document.getElementById('auth-pw2').value;
      const tc = document.getElementById('auth-teacher-code').value;
      const err = document.getElementById('auth-err');
      if (!id || !pw) { err.textContent = '아이디와 비밀번호를 입력하세요'; return; }
      if (authMode==='signup' && pw!==pw2) { err.textContent = '비밀번호가 달라요'; return; }
      if (authMode==='signup' && authRole==='teacher' && tc!==TEACHER_CODE) { err.textContent = '선생님 가입 코드가 틀려요'; return; }
      const body = { action: authMode==='signup'?'signup':'login', username:id, passHash: await hashPass(pw), role:authRole, displayName:id };
      if (authMode==='signup' && authRole==='teacher') body.teacherCode = tc;
      const data = await authRequest(body);
      if (!data || !data.ok) {
        const msg = {
          badrole: '학생/선생님 계정 종류가 맞지 않아요',
          exists: '이미 있는 아이디예요',
          bad: '아이디 또는 비밀번호가 틀려요',
          badteacher: '선생님 가입 코드가 틀려요',
          network: '인터넷 연결을 확인해 주세요',
          badjson: '서버 오류 — Apps Script를 새로 배포했는지 확인해 주세요'
        };
        err.textContent = msg[data && data.error] || (data && String(data.error).startsWith('http_') ? '시트 접근 거부(403) — 배포를 「모든 사용자」로 해 주세요' : '로그인/가입에 실패했어요. 회원가입을 먼저 해 보세요.');
        return;
      }
      user = { uid:'u:'+id, username:id, displayName:data.displayName||id, role:data.role||authRole, grade:data.grade||'초급', points:data.points||0 };
      writeLS(LS.user, user); closeLogin(); renderAuth(); goDefaultPage();
    }
    function logout() { user = null; localStorage.removeItem(LS.user); renderAuth(); setToolbarExtra(''); setToolbarCenter(''); showPage('mine'); }

    function goDefaultPage() { showPage(isTeacher() ? 'questions' : 'mine'); }

    function showPage(id) {
      if (['mypage','homework'].includes(id) && !user) { openLogin(); return; }
      if (['students','create','questions'].includes(id)) {
        if (!user) { openLogin(); setAuthRole('teacher'); return; }
        if (!isTeacher()) { alert('선생님 계정으로 로그인해 주세요'); return; }
      }
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-'+id).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.p === id));
      setToolbarExtra('');
      setToolbarCenter('');
      if (id==='external') renderExternal();
      if (id==='mine') renderMine();
      if (id==='mypage') renderMypage();
      if (id==='homework') renderHomework();
      if (id==='students') renderStudents();
      if (id==='questions') renderTeacherQuestions();
      if (id==='create') { setToolbarExtra(''); setToolbarCenter(''); }
    }

    function renderExternal() {
      const list = document.getElementById('external-list');
      const empty = document.getElementById('external-empty');
      if (!courses.length) { list.innerHTML=''; empty.style.display='block'; return; }
      empty.style.display='none';
      list.innerHTML = courses.map(c => {
        const avg = avgRating(c.id);
        const enrolled = user && myEnrollments().some(e => e.courseId===c.id);
        return `<div class="ext-card">
          <div class="logo-box">강의 로고</div>
          <h3>${esc(c.title)}</h3>
          ${starsHtml(avg)}
          <div class="ext-card-actions">
            <button class="btn-pill white" onclick="openReviewsView('${c.id}')">후기 보기</button>
            ${enrolled ? `<button class="btn-pill" onclick="showPage('mine');renderMine('${c.id}')">내 강의</button>`
              : `<button class="btn-pill" onclick="enrollCourse('${c.id}')">수강하기</button>`}
          </div>
        </div>`;
      }).join('');
    }

    async function enrollCourse(id) {
      if (!user) { openLogin(); return; }
      const c = getCourse(id);
      if (myEnrollments().some(e => e.courseId===id)) { showPage('mine'); return; }
      const row = { action:'enroll', timestamp:String(Date.now()), date:new Date().toLocaleString('ko-KR'), uid:user.uid, name:user.displayName, courseId:id, courseName:c.title, currentWeek:1 };
      enrollments.push(row); writeLS(LS.enroll, enrollments); await apiPost(row);
      showPage('mine');
    }

    function renderMine(forceId) {
      const box = document.getElementById('mine-content');
      const mine = user ? myEnrollments() : [];
      const en = mine.find(e => e.courseId === (forceId||selectedCourseId)) || mine[0];
      if (en) selectedCourseId = en.courseId;
      const c = en ? getCourse(en.courseId) : null;
      const week = en ? Number(en.currentWeek||1) : '';
      const maxLabel = c ? (c.maxWeeks || 8) + '주차' : '최대 주차';
      const title = c ? c.title : '강의 제목';
      const content = c ? (c.content||c.desc||'') : '그 주차 학습내용';
      const materials = c ? (c.materials||'') : '그 주차 준비물';
      const avg = c ? avgRating(c.id) : 0;
      const myRev = (user && c) ? myReviewFor(c.id) : null;
      const myEvals = (user && c) ? evaluations.filter(e => e.uid===user.uid && e.courseId===c.id) : [];
      const myQs = (user && c) ? questions.filter(q => q.uid===user.uid && q.courseId===c.id) : [];
      const rating = myRev ? myRev.rating : avg;

      setToolbarCenter(`<span>별점</span>${starsHtml(rating)}`);
      setToolbarExtra(c && user
        ? `<button class="btn-pill" onclick="openReview('${c.id}')">후기 작성</button>`
        : `<button class="btn-pill" onclick="${user ? 'showPage(\'external\')' : 'openLogin()'}">후기 작성</button>`);

      const evalText = myEvals.map(e => {
        let t = esc(e.text);
        if (e.teacherReply) t += '\n선생님: ' + esc(e.teacherReply);
        return t;
      }).join('\n');
      const qAttr = (c && user)
        ? `onblur="if(this.value.trim())submitQuestion('${c.id}')"`
        : `onclick="openLogin()"`;
      const eAttr = (c && user)
        ? `onblur="if(this.value.trim())submitEval('${c.id}')"`
        : `onclick="openLogin()"`;

      box.innerHTML = `
        <div class="course-hero">
          <div class="hero-logo">강의 로고</div>
          <div class="hero-title">${esc(title)}</div>
        </div>
        <div class="info-lines">
          <div>현재 : (${week})주차 / ${maxLabel}</div>
          <div>학습내용 미리보기 : (${esc(content)})</div>
          <div>준비물 : (${esc(materials)})</div>
        </div>
        <div class="action-block">
          <h3>질문하기</h3>
          <p class="hint">궁금한 점이 있나요?</p>
          <textarea class="blue-bar" id="mine-question" ${qAttr}></textarea>
          ${myQs.map(q=>`<div class="blue-bar-static" style="margin-top:8px"><b>Q.</b> ${esc(q.text)}${q.answer?`<br><b>A.</b> ${esc(q.answer)}`:''}</div>`).join('')}
        </div>
        <div class="action-block">
          <h3>평가하기</h3>
          <p class="hint">아쉬웠던 점이 있나요?</p>
          <textarea class="blue-bar" id="mine-eval" ${eAttr}></textarea>
        </div>
        <div class="action-block">
          <h3>평가결과</h3>
          <p class="hint">선생님이 공부 태도를 관찰한 결과에요.</p>
          <div class="blue-bar-static">${evalText}</div>
        </div>`;
    }

    async function submitQuestion(courseId) {
      const text = document.getElementById('mine-question').value.trim();
      if (!text) return;
      const c = getCourse(courseId);
      const row = { action:'question', timestamp:String(Date.now()), date:new Date().toLocaleString('ko-KR'), uid:user.uid, name:user.displayName, courseId, courseName:c.title, text };
      questions.push(row); writeLS(LS.questions, questions); await apiPost(row); renderMine(courseId);
    }
    async function submitEval(courseId) {
      const text = document.getElementById('mine-eval').value.trim();
      if (!text) return;
      const c = getCourse(courseId);
      const row = { action:'evaluation', timestamp:String(Date.now()), date:new Date().toLocaleString('ko-KR'), uid:user.uid, name:user.displayName, courseId, courseName:c.title, text };
      evaluations.push(row); writeLS(LS.evals, evaluations); await apiPost(row);
      user.points = (user.points||0)+10; writeLS(LS.user, user); renderMine(courseId);
    }

    function renderMypage() {
      const box = document.getElementById('mypage-content');
      if (!user) { box.innerHTML='<div class="empty">Log in 후 마이 페이지를 볼 수 있어요.</div>'; return; }
      const mine = isTeacher() ? courses.filter(c => c.teacherUid===user.uid) : myEnrollments().map(e=>getCourse(e.courseId)).filter(Boolean);
      const label = isTeacher() ? '만들어낸 강의' : '수강 중인 강의';
      let note = '';
      if (isTeacher()) {
        const myC = courses.filter(c => c.teacherUid === user.uid);
        const teacherAvg = myC.length ? myC.reduce((a,c) => a + avgRating(c.id), 0) / myC.length : 0;
        const need = Math.max(0, (5 - teacherAvg)).toFixed(1);
        note = `다음 등급까지: (평균 별점) ${need}점 더 얻기`;
      } else {
        const weeksLeft = Math.max(0, 8 - (myEnrollments()[0]?.currentWeek || 1));
        note = `다음 등급까지: (${weeksLeft})주차 더 듣기`;
      }
      box.innerHTML = `
        <div class="profile">
          <h2>${esc(user.displayName)}</h2>${isTeacher()?'<span class="grade-tag">선생님</span>':`<span class="grade-tag">${esc(user.grade||'초급')}</span>`}
          <div style="margin-top:12px"><button class="btn-pill white" onclick="changeName()">이름 바꾸기</button></div>
          <div class="profile-note">${note}</div>
        </div>
        <div class="section-title">${label}</div>
        <div class="chip-row">${mine.length ? mine.map(c=>`<div class="chip" onclick="selectCourse('${c.id}')">${esc((c.title||'').slice(0,6))}</div>`).join('') : '<span style="color:var(--muted);font-size:13px">아직 없어요</span>'}</div>`;
    }
    function changeName() {
      const n = prompt('새 이름', user.displayName);
      if (!n||!n.trim()) return;
      user.displayName = n.trim(); writeLS(LS.user, user);
      apiPost({ action:'updateProfile', username:user.username, displayName:user.displayName });
      renderMypage(); renderAuth();
    }
    function selectCourse(id) { selectedCourseId=id; isTeacher()?showPage('students'):(showPage('mine'), renderMine(id)); }

    function renderHomework() {
      const box = document.getElementById('homework-content');
      if (!user||isTeacher()) { box.innerHTML='<div class="empty">학생 전용 페이지예요.</div>'; return; }
      const mine = myEnrollments();
      if (!mine.length) { box.innerHTML='<div class="empty">수강 중인 강의가 없어요.</div>'; return; }
      const c = getCourse(mine[0].courseId);
      const key = LS.hwDone+'_'+user.uid+'_'+mine[0].courseId;
      const done = localStorage.getItem(key)==='1';
      box.innerHTML = `
        <div class="hw-banner">${esc(c?c.title:'강의 제목')}</div>
        <div class="hw-body">${done?'완료! 🎉':esc(c?(c.homework||'숙제 내용'):'숙제 내용')}</div>
        ${done?'':`<div class="hw-foot"><button class="btn-big" onclick="markHwDone('${key}')">완료로 표시</button></div>`}`;
    }
    function markHwDone(k) { localStorage.setItem(k,'1'); user.points=(user.points||0)+20; writeLS(LS.user,user); renderHomework(); }

    function renderStudents() {
      const box = document.getElementById('students-content');
      const myCourses = courses.filter(c => c.teacherUid===user.uid);
      if (!myCourses.length) { box.innerHTML='<div class="empty">강의 설정에서 강의를 만들어 주세요.</div>'; return; }
      const c = myCourses[0];
      const students = enrollments.filter(e => e.courseId===c.id);
      const avg = avgRating(c.id);
      setToolbarCenter(`<span>별점</span>${starsHtml(avg)}`);
      box.innerHTML = `
        <div class="course-hero">
          <div class="hero-logo">강의 로고</div>
          <div class="hero-title">${esc(c.title)}</div>
        </div>
        <div class="info-lines">현재 : (1)주차 / ${c.maxWeeks||8}주차</div>
        <div class="section-title">학생 리스트</div>
        ${students.length ? students.map((s,i)=>`<div class="student-item">
          <span class="no">${i+1}</span><span class="nm">${esc(s.name)}</span><div class="track"></div>
          <button class="btn-pill" onclick="sendResult('${s.uid}')">결과 보내기</button>
        </div>`).join('') : '<div class="empty">아직 학생이 없어요.</div>'}`;
    }
    function sendResult(uid) { alert('평가 결과를 보냈어요!'); }

    async function createCourse() {
      if (!isTeacher()) return;
      const title = document.getElementById('create-title').value.trim();
      if (!title) { alert('제목을 입력하세요'); return; }
      const id = 'c'+Date.now();
      const row = { action:'createCourse', id, title, desc:'', maxWeeks:document.getElementById('create-weeks').value||8,
        content:document.getElementById('create-content').value.trim(), materials:document.getElementById('create-materials').value.trim(),
        homework:document.getElementById('create-homework').value.trim(), teacherUid:user.uid, teacherName:user.displayName };
      courses.push({...row, created:new Date().toISOString()}); writeLS(LS.courses, courses); await apiPost(row);
      ['create-title','create-content','create-materials','create-homework'].forEach(i=>document.getElementById(i).value='');
      showPage('students');
    }

    function renderTeacherQuestions() {
      const feed = document.getElementById('teacher-questions');
      const empty = document.getElementById('questions-empty');
      if (!questions.length) { feed.innerHTML=''; empty.style.display='block'; return; }
      empty.style.display='none';
      feed.innerHTML = questions.map(q => {
        const ts = q.timestamp;
        const done = q.answer && String(q.answer).trim();
        return `<div class="q-item">
          <div class="tag">(질문)</div><div class="body">${esc(q.text)}</div>
          ${done ? `<div class="tag">(대답)</div><div class="body">${esc(q.answer)}</div>` :
            `<div class="tag">(대답 입력)</div><textarea id="ans-${ts}"></textarea><button class="btn-pill" onclick="answerQuestion('${ts}')">완료로 표시</button>`}
        </div>`;
      }).join('');
    }
    async function answerQuestion(ts) {
      const answer = (document.getElementById('ans-'+ts)||{}).value?.trim();
      if (!answer) return;
      questions = questions.map(q => q.timestamp===ts ? {...q, answer, answerDate:new Date().toLocaleString('ko-KR')} : q);
      writeLS(LS.questions, questions);
      await apiPost({ action:'answerQuestion', timestamp:ts, answer, answerDate:new Date().toLocaleString('ko-KR') });
      renderTeacherQuestions();
    }

    function openReview(courseId) {
      if (!user) { openLogin(); return; }
      reviewCourseId = courseId; reviewRating = 5;
      document.getElementById('review-course-name').textContent = getCourse(courseId)?.title || '';
      renderStarInput(); document.getElementById('review-text').value='';
      document.getElementById('review-modal').classList.add('show');
    }
    function closeReview() { document.getElementById('review-modal').classList.remove('show'); }
    function renderStarInput() {
      document.getElementById('review-stars').innerHTML = [1,2,3,4,5].map(i=>`<span class="${i<=reviewRating?'on':''}" onclick="setReviewStar(${i})">★</span>`).join('');
    }
    function setReviewStar(n) { reviewRating=n; renderStarInput(); }
    async function submitReview() {
      const c = getCourse(reviewCourseId);
      const row = { action:'review', timestamp:String(Date.now()), date:new Date().toLocaleString('ko-KR'), uid:user.uid, name:user.displayName, courseId:reviewCourseId, courseName:c.title, rating:reviewRating, text:document.getElementById('review-text').value.trim() };
      reviews.push(row); writeLS(LS.reviews, reviews); await apiPost(row); closeReview();
      if (document.getElementById('page-mine').classList.contains('active')) renderMine(reviewCourseId);
      if (document.getElementById('page-external').classList.contains('active')) renderExternal();
    }
    function openReviewsView(courseId) {
      document.getElementById('reviews-view-title').textContent = getCourse(courseId)?.title || '';
      const rs = reviews.filter(r => r.courseId===courseId);
      document.getElementById('reviews-list').innerHTML = rs.length
        ? rs.map(r=>`<div class="q-item">${starsHtml(r.rating)} <b>${esc(r.name)}</b><div class="body">${esc(r.text)}</div></div>`).join('')
        : '<p class="empty">아직 후기가 없어요.</p>';
      document.getElementById('reviews-view-modal').classList.add('show');
    }
    function closeReviewsView() { document.getElementById('reviews-view-modal').classList.remove('show'); }

    function esc(s) { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

    document.getElementById('login-modal').onclick = e => { if (e.target.id==='login-modal') closeLogin(); };
    document.getElementById('review-modal').onclick = e => { if (e.target.id==='review-modal') closeReview(); };
    document.getElementById('reviews-view-modal').onclick = e => { if (e.target.id==='reviews-view-modal') closeReviewsView(); };

    (async function boot() {
      initData(); await serverWipeOnce(); renderAuth(); await syncAll();
      showPage(user ? (isTeacher() ? 'questions' : 'mine') : 'mine');
      if (!user) renderMine();
    })();
  </script>
</body>
</html>
